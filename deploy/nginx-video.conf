# On-prem HLS video origin for AdPlus.
#
# The ad catalog is small (dozens–hundreds of short clips), so the whole library
# lives in the OS page cache and one modest box serves tens of thousands of
# concurrent streams. Keep this host on ETC's zero-rated IP range so subscriber
# video traffic is free and egress stays internal.

proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:50m
                 max_size=5g inactive=2h use_temp_path=off;

server {
    listen 8080;
    server_name _;

    # Zero-copy, sequential reads tuned for media segments.
    sendfile on;
    tcp_nopush on;
    aio threads;
    directio 4m;
    output_buffers 2 1m;

    # HLS: pre-transcoded playlists + segments produced by transcode-hls.sh
    location /hls/ {
        root /srv;                       # serves /srv/hls/<adId>/...
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
        }
        # Playlists change rarely but shouldn't be cached as hard as segments.
        location ~ \.m3u8$ {
            root /srv;
            add_header Cache-Control "public, max-age=30";
            add_header Access-Control-Allow-Origin "*";
        }
    }

    # Optional progressive-MP4 fallback for players without HLS.
    location /mp4/ {
        root /srv;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
    }

    location = /healthz { return 200 "ok\n"; }
}
